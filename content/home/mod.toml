# tes3-saves as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `tes3_saves-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "0921f076-a7ea-4c32-82a6-a57040fe866e"
slug = "tes3_saves"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.tes3-saves"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
