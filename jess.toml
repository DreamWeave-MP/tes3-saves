manifest_version = 1

[package]
id = "org.dreamweave.tes3-saves"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/style.luau"]

[dependencies]
"org.dreamweave.tes3" = "0.1"

# The suite hands `loadOrder.fromOpenMw` a real Context; the package itself only names its shape.
[dev-dependencies]
"org.dreamweave.openmw" = "0.1"

[modules]
"@tes3-saves" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it.

[[layer]]
id = "tes3-saves.core"
requires = ["tes3.core"]
exports = ["@tes3-saves"]
