manifest_version = 1

[package]
id = "org.dreamweave.tes3-saves"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/tree.luau", "tests/commands.luau", "tests/style.luau"]

# tes3 is what a save is made of. openmw is here for the commands alone: `check` and `strip` are
# given a configuration by its path and need the load order it describes; @tes3-saves itself
# still takes a load order as a value and names an OpenMW Context only by its shape.
[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.openmw" = "0.1"

[modules]
"@tes3-saves" = "src/init.luau"
"@tes3-saves/commands" = "src/commands.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. @tes3-saves works on saves in memory, and reads a load order's
# content files through the load order it is handed. @tes3-saves/commands is each command as a
# function of a request to a result: it reads the save a request names and, for `check` and
# `strip` with a configuration, the configuration chain and the content files it finds, and it
# writes a stripped save, a screenshot, or extracted records with the backup of what they
# replace, so its caller needs filesystem.read and, for a command that writes, filesystem.write.

[[layer]]
id = "tes3-saves.core"
requires = ["tes3.core", "openmw.core"]
exports = ["@tes3-saves", "@tes3-saves/commands"]
